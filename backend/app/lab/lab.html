<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이야기 실험실</title>
<style>
  :root { --bg:#faf7f2; --card:#fff; --ink:#2b2b2b; --muted:#777; --accent:#e07a5f; --ok:#3a7d44; --bad:#c0392b; --line:#e6e0d6; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 13px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-top: 16px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  label { font-size: 14px; }
  select, input[type=number] { font: inherit; padding: 6px 8px; border:1px solid var(--line); border-radius: 8px; }
  .cards { display:grid; grid-template-columns: repeat(auto-fill, minmax(96px,1fr)); gap:8px; margin-top: 10px; }
  .chip { border:1px solid var(--line); border-radius: 10px; padding: 10px 6px; text-align:center; cursor:pointer; user-select:none; background:#fff; }
  .chip.on { border-color: var(--accent); background: #fdeee9; font-weight: 600; }
  .chip.trait { background: #f4f1fb; }
  .chip.trait.on { background: #e6defa; border-color: #7a5cc7; }
  .chip .kind { display:block; font-size: 11px; color: var(--muted); font-weight: 400; }
  .choices button.phrase { background: #7a5cc7; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: none; background: var(--accent); color:#fff; cursor:pointer; }
  button:disabled { background:#ccc; cursor: default; }
  button.ghost { background: #fff; color: var(--ink); border:1px solid var(--line); }
  .seg h2 { font-size: 16px; margin: 0 0 6px; }
  .meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .meta .ok { color: var(--ok); } .meta .bad { color: var(--bad); } .meta .warn { color: #b7791f; }
  .page { padding: 8px 0; border-top: 1px dashed var(--line); }
  .page:first-of-type { border-top: none; }
  .text { font-size: 17px; line-height: 1.7; }
  .scene { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .choices { display:flex; gap:8px; flex-wrap:wrap; margin-top: 10px; }
  .error { color: var(--bad); font-size: 14px; white-space: pre-wrap; }
  .loading { color: var(--muted); font-size: 14px; }
  audio { width: 100%; margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>이야기 실험실</h1>
  <div class="muted">모델·카드·선택지를 골라 구간별 생성 결과, 시간, 음성을 확인합니다. 결과는 서버 메모리에만 있어요.</div>

  <section>
    <div class="row">
      <label>이야기 모델 <select id="model"></select></label>
      <label>예비 모델 <select id="fallback"></select></label>
    </div>
    <div class="row" style="margin-top:10px">
      <span>함께 동시에 돌릴 모델</span>
      <span id="raceBox" class="row" style="gap:10px"></span>
      <span class="muted">고르면 동시에 돌려 가장 먼저 끝난 결과를 씀 (예비 모델 대신, 한도는 모두 씀)</span>
      <label>프롬프트 <select id="promptVersion"></select></label>
      <label>선택 횟수 <input id="choiceCount" type="number" min="2" max="5" value="4" style="width:64px"></label>
    </div>
    <div class="row" style="margin-top:10px">
      <label>음성 모델 <select id="ttsModel"></select></label>
      <label>목소리 <select id="voice"></select></label>
      <label>속도 <select id="ttsStyle"><option value="slow">천천히</option><option value="normal">보통</option></select></label>
      <span class="muted">음성은 모델마다 하루 10회라 버튼을 눌렀을 때만 만들어요.</span>
    </div>
    <div class="row" style="margin-top:14px">
      <strong id="stepQuestion" style="font-size:17px"></strong>
      <button class="ghost" id="reshuffle" style="margin-left:auto">다시 뽑기</button>
    </div>
    <div class="muted" id="picksSummary" style="margin-top:4px"></div>
    <div class="cards" id="cards"></div>
    <div class="row" style="margin-top:12px">
      <button class="ghost" id="backBtn" disabled>이전</button>
      <button id="startBtn" disabled>이야기 시작</button>
      <span class="muted" id="pickCount"></span>
    </div>
  </section>

  <div id="story"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let storyId = null;

function option(sel, values) {
  sel.innerHTML = values.map(v => `<option value="${v}">${v}</option>`).join("");
}

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  if (!res.ok) {
    let detail;
    try { detail = (await res.json()).detail; } catch { detail = res.statusText; }
    throw { status: res.status, detail };
  }
  return res;
}

async function init() {
  const cfg = await (await api("/api/config")).json();
  // 표시는 실제 모델 ID, 값은 models.json 의 name
  const label = (m) => cfg.model_ids?.[m] ?? m;
  $("model").innerHTML = cfg.models.map(m => `<option value="${m}">${label(m)}</option>`).join("");
  $("raceBox").innerHTML = cfg.models.map(m =>
    `<label style="font-size:13px"><input type="checkbox" class="race" value="${m}"> ${label(m)}</label>`).join("");
  option($("ttsModel"), cfg.tts_models);
  option($("promptVersion"), cfg.prompt_versions);
  $("fallback").innerHTML = `<option value="">없음</option>` + cfg.models.map(m => `<option value="${m}">${label(m)}</option>`).join("");
  if (cfg.models.length > 1) $("fallback").value = cfg.models[1];
  $("promptVersion").value = cfg.prompt_versions[cfg.prompt_versions.length - 1];
  option($("voice"), cfg.voices);
  noModels = cfg.models.length === 0;
  await loadStartOptions();
}

// 처음 선택 4단계: 주인공 → 성격 → 배경 → 사물 (후보는 서버가 무작위로 뽑음)
const STEPS = [
  { key: "heroes", ask: () => "이번 이야기의 주인공은 누구일까요?" },
  { key: "traits", ask: (p) => `${p[0].name}${josa(p[0].name)} 한마디로 말하면...` },
  { key: "backgrounds", ask: () => "어디에서, 어떤 날 일어난 이야기일까요?" },
  { key: "objects", ask: (p) => `${p[0].name}${josa(p[0].name, "이가")} 가지고 있던 것은?` },
];
let startOptions = null, step = 0, noModels = false;
const picks = [];

// 받침에 따라 조사 고르기: "곰은 / 토끼는", "곰이 / 토끼가"
function josa(word, pair = "은는") {
  const code = word.charCodeAt(word.length - 1) - 0xac00;
  const hasFinal = code >= 0 && code % 28 !== 0;
  return pair === "은는" ? (hasFinal ? "은" : "는") : (hasFinal ? "이" : "가");
}

async function loadStartOptions() {
  startOptions = await (await api("/api/start-options")).json();
  step = 0; picks.length = 0;
  renderStep();
}

function renderStep() {
  const done = step >= STEPS.length;
  $("picksSummary").textContent = picks.length ? "고른 것: " + picks.map(p => (p.emoji ? p.emoji + " " : "") + p.name).join(" · ") : "";
  $("backBtn").disabled = picks.length === 0;
  $("startBtn").disabled = !done || noModels;
  $("pickCount").textContent = noModels ? "API 키가 있는 모델이 없어요 (.env 확인)" : (done ? "준비 완료!" : `${step + 1} / ${STEPS.length} 단계`);
  if (done) { $("stepQuestion").textContent = "이야기를 시작해 볼까요?"; $("cards").innerHTML = ""; return; }
  const s = STEPS[step];
  $("stepQuestion").textContent = s.ask(picks);
  const items = startOptions[s.key];
  $("cards").innerHTML = items.map((c, i) =>
    `<div class="chip ${c.emoji ? "trait" : ""}" data-i="${i}">${c.emoji ? c.emoji + " " : ""}${c.name}</div>`).join("");
  document.querySelectorAll(".chip").forEach(el => el.onclick = () => {
    picks.push(items[Number(el.dataset.i)]);
    step += 1;
    renderStep();
  });
}

$("backBtn").onclick = () => { picks.pop(); step = picks.length; renderStep(); };
$("reshuffle").onclick = () => loadStartOptions();

// 오류 코드를 사람이 읽는 말로
const ERR = { "llm_error:429": "분당 한도 초과(429)", "llm_error:None": "응답 없음/시간 초과", choices: "선택지 문제",
  page_count: "페이지 수", cards_missing: "카드 누락", wrong_hero: "주인공 오류", unchosen_used: "안 고른 선택지 등장",
  "llm_error:503": "서버 과부하(503)", json: "JSON 형식", mixed_choices: "선택지 종류 섞임", schema: "형식 누락", unsafe: "금지어", not_korean: "한글 아님", too_long: "너무 김", empty_text: "빈 본문" };
const errName = (x) => ERR[x] ?? x;

// 시도 하나의 실패 원인을 자세히: 모델이 보낸 선택지, 검증에서 빠진 항목, 페이지 수, API 오류 내용
function attemptDetail(a) {
  const lines = [`- ${a.model}: ${a.errors.map(errName).join(", ")} (${(a.latency_ms/1000).toFixed(1)}초)`];
  if (a.message) lines.push(`    API 오류 내용: ${a.message}`);
  if (!a.message) {
    lines.push(`    페이지 수: ${a.page_count}장`);
    lines.push(`    모델이 보낸 선택지: ${a.sent_choices.length ? a.sent_choices.join(", ") : "(비어 있음)"}`);
    if (a.dropped.length) lines.push(`    검증에서 빠진 항목: ${a.dropped.join(", ")}`);
  }
  return lines.join("\n");
}

function errorText(e) {
  if (e.detail && e.detail.attempts) {
    return "생성 실패\n" + e.detail.attempts.map(attemptDetail).join("\n");
  }
  return `오류 ${e.status ?? ""}: ${typeof e.detail === "string" ? e.detail : JSON.stringify(e.detail)}`;
}

function renderSegment(seg) {
  const el = document.createElement("section");
  el.className = "seg";
  const attempts = seg.attempts.map(a => `<span class="${a.ok ? "ok" : "bad"}" title="${a.ok ? "" : attemptDetail(a).replace(/"/g, "'")}">${a.ok ? `성공(${a.model.split("/").pop()})` : a.errors.map(errName).join(",")}</span>${a.ok && a.warnings?.length ? ` <span class="warn" title="규칙 위반이지만 결과를 그대로 사용">⚠ ${a.warnings.map(errName).join(", ")}</span>` : ""}`).join(" → ");
  const label = { intro: "도입", middle: "중간", ending: "결말" }[seg.type];
  el.innerHTML = `
    <h2>${seg.index + 1}. ${label}</h2>
    <div class="meta">${seg.raced?.length ? `동시 ${seg.raced.length}개 중 1등: ` : ""}${seg.model_used} · ${seg.pages.map(p => p.text.length).join("/")}자 · ${(seg.latency_ms / 1000).toFixed(1)}초 · 시도: ${attempts}</div>
    ${seg.pages.map(p => `
      <div class="page">
        <div class="text">${p.text}</div>
        <div class="scene">배경 ${p.scene.background}(${p.scene.time}) · 등장 ${p.scene.characters.map(c => `${c.id}:${c.state}`).join(", ") || "-"} · 사물 ${p.scene.objects.join(", ") || "-"} · 분위기 ${p.mood} · 효과음 ${p.sfx ?? "-"}</div>
      </div>`).join("")}
    <div class="row" style="margin-top:8px"><button class="ghost tts">이 구간 음성 듣기</button><span class="muted tts-status"></span></div>
  `;
  const ttsBtn = el.querySelector(".tts");
  ttsBtn.onclick = async () => {
    ttsBtn.disabled = true;
    const status = el.querySelector(".tts-status");
    status.textContent = "음성 만드는 중...";
    const t0 = performance.now();
    try {
      const res = await api("/api/tts", { text: seg.pages.map(p => p.text).join(" "), voice: $("voice").value, model: $("ttsModel").value, style: $("ttsStyle").value });
      const url = URL.createObjectURL(await res.blob());
      const audio = document.createElement("audio");
      audio.controls = true; audio.src = url; audio.autoplay = true;
      el.appendChild(audio);
      status.textContent = `${((performance.now() - t0) / 1000).toFixed(1)}초 · ${$("ttsModel").value} / ${$("voice").value} / ${$("ttsStyle").selectedOptions[0].text}`;
    } catch (e) {
      status.textContent = e.status === 429 ? "이 음성 모델의 오늘 한도를 다 썼어요. 다른 모델을 골라보세요." : errorText(e);
      ttsBtn.disabled = false;
    }
  };
  if (seg.choices.length) {
    const box = document.createElement("div");
    box.className = "choices";
    seg.choices.forEach(c => {
      const b = document.createElement("button");
      b.textContent = c.label;
      if (c.kind === "phrase") b.classList.add("phrase");
      b.onclick = () => { box.querySelectorAll("button").forEach(x => x.disabled = true); b.style.background = "#3a7d44"; next(c.id); };
      box.appendChild(b);
    });
    el.appendChild(box);
  } else {
    el.insertAdjacentHTML("beforeend", `<div class="muted" style="margin-top:10px">끝.</div>`);
  }
  $("story").appendChild(el);
  el.scrollIntoView({ behavior: "smooth", block: "start" });
}

async function run(path, body) {
  const loading = document.createElement("section");
  loading.className = "loading";
  loading.textContent = "이야기를 쓰는 중...";
  $("story").appendChild(loading);
  const t0 = performance.now();
  const timer = setInterval(() => loading.textContent = `이야기를 쓰는 중... ${((performance.now() - t0) / 1000).toFixed(0)}초`, 500);
  try {
    const seg = await (await api(path, body)).json();
    storyId = seg.story_id;
    loading.remove();
    renderSegment(seg);
  } catch (e) {
    loading.className = "error";
    loading.textContent = errorText(e);
  } finally {
    clearInterval(timer);
  }
}

$("startBtn").onclick = () => {
  $("story").innerHTML = "";
  run("/api/stories", { cards: picks.map(p => p.id), model: $("model").value, choice_count: Number($("choiceCount").value), prompt_version: $("promptVersion").value, fallback_model: $("fallback").value || null,
    race: [...document.querySelectorAll(".race:checked")].map(x => x.value) });
};
function next(choiceId) { run(`/api/stories/${storyId}/next`, { choice_id: choiceId }); }

init().catch(e => { $("pickCount").textContent = errorText(e); });
</script>
</body>
</html>
